<!-- src/app/app.component.html -->
<div class="container">
  <header>
    <h1>Task Management Dashboard</h1>
  </header>

  <main>
    <!-- Add Item Section Form Input -->
    <div class="form-container">
      <input 
        type="text" 
        [ngModel]="newTaskTitle()" 
        (ngModelChange)="newTaskTitle.set($event)"
        (keyup.enter)="handleCreateTodo()"
        placeholder="Enter your task details here..." 
        aria-label="New task descriptive text" />
      <button (click)="handleCreateTodo()" [disabled]="!newTaskTitle().trim()">
        Add Task
      </button>
    </div>

    <!-- Active Structural Items Mapping -->
    <div class="list-wrapper">
      @if (todoService.todos().length === 0) {
        <p class="empty-state">No current items recorded. Create one above!</p>
      } @else {
        <ul class="todo-list">
          @for (item of todoService.todos(); track item.id) {
            <li class="todo-item">
              <span class="title-text">{{ item.title }}</span>
              <button 
                class="delete-btn" 
                (click)="handleDeleteTodo(item.id)"
                [attr.aria-label]="'Delete ' + item.title">
                Delete
              </button>
            </li>
          }
        </ul>
      }
    </div>
  </main>
</div>
